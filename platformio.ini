; PlatformIO Project Configuration File for LED-FOR-CAR-DECORATION IoT Device
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
description = Firmware for Smart Automotive Ambient Lighting (Car LED Decoration)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_filter = test_smoke
board_build.partitions = min_spiffs.csv

; Serial Monitor & Upload Settings
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 921600
upload_flags = 
    --before=default_reset
    --after=hard_reset

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3          ; 0: None, 1: Error, 2: Warn, 3: Info, 4: Debug, 5: Verbose
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Dependencies
lib_deps = 
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.12
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.1
    knolleary/PubSubClient @ ^2.8

; Compile/run hardware regression suite separately; normal firmware remains esp32dev.
[env:esp32dev-live-test]
extends = env:esp32dev
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
test_filter = test_live_canvas
